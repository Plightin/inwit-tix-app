{% extends 'layout.html' %}
{% block title %}Log In to Inwit Tix{% endblock %}
{% block content %}
<div class="form-container" style="max-width: 450px; text-align: center;">
    <h1 class="form-title" style="margin-bottom: 10px;">Unified Login</h1>
    <p style="color: #6b7280; margin-bottom: 30px;">
        {% if requested_role == 'organizer' %}
            Registering as an Event Organizer
        {% else %}
            Use your Inwit TV account to log in.
        {% endif %}
    </p>

    <!-- Loading Spinner -->
    <div id="loader" style="display: none; margin: 20px auto;" class="spinner"></div>

    <!-- Firebase Auth Container (Buttons will render here) -->
    <div id="firebaseui-auth-container"></div>
</div>

<!-- Firebase App (the core Firebase SDK) -->
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
<!-- Firebase Auth -->
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
<!-- FirebaseUI for pre-built UI components -->
<script src="https://www.gstatic.com/firebasejs/ui/6.0.2/firebase-ui-auth.js"></script>
<link type="text/css" rel="stylesheet" href="https://www.gstatic.com/firebasejs/ui/6.0.2/firebase-ui-auth.css" />

<script>
    // 1. Initialize Firebase (PASTE YOUR INWIT TV FIREBASE CONFIG HERE)
    const firebaseConfig = {
        apiKey: "YOUR_API_KEY",
        authDomain: "YOUR_PROJECT.firebaseapp.com",
        projectId: "YOUR_PROJECT_ID",
        storageBucket: "YOUR_PROJECT.appspot.com",
        messagingSenderId: "YOUR_SENDER_ID",
        appId: "YOUR_APP_ID"
    };
    firebase.initializeApp(firebaseConfig);

    // 2. Initialize the FirebaseUI Widget using Firebase.
    var ui = new firebaseui.auth.AuthUI(firebase.auth());

    // 3. Configure FirebaseUI
    var uiConfig = {
        callbacks: {
            signInSuccessWithAuthResult: function(authResult, redirectUrl) {
                // Show loading spinner
                document.getElementById('firebaseui-auth-container').style.display = 'none';
                document.getElementById('loader').style.display = 'block';

                // Get the secure ID token
                authResult.user.getIdToken().then(function(idToken) {
                    // Send token to our Flask backend for unified login
                    fetch('/api/firebase-login', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({
                            idToken: idToken,
                            role: "{{ requested_role }}" // Tells backend if they want to be an organizer
                        })
                    })
                    .then(response => response.json())
                    .then(data => {
                        if (data.redirect) {
                            window.location.href = data.redirect;
                        } else {
                            alert("Login failed: " + data.error);
                            window.location.reload();
                        }
                    });
                });
                // Return false so UI doesn't try to redirect automatically
                return false; 
            }
        },
        signInFlow: 'popup',
        signInOptions: [
            // Leave exactly what you use on Inwit TV
            firebase.auth.PhoneAuthProvider.PROVIDER_ID,
            firebase.auth.GoogleAuthProvider.PROVIDER_ID
        ],
        // Terms of service url.
        tosUrl: '#',
        privacyPolicyUrl: '#'
    };

    // 4. Start the UI
    ui.start('#firebaseui-auth-container', uiConfig);
</script>
{% endblock %}
